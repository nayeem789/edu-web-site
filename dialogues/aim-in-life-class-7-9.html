      <div class="topic-box-item" id="topic-item-201" onclick="handleTopicClick(this, 'Aim in Life Dialogue for Class 7-9', `Rafi: Hello, Sohan. What is your aim in life?\nSohan: My aim in life is to become a teacher.\nRafi: Why do you want to become a teacher?\nSohan: Because I want to teach children and help them learn.\nRafi: Do you think teaching is a good job?\nSohan: Yes. Teachers help to build good people and a good country.\nRafi: What will you do to reach your aim?\nSohan: I will study hard and listen to my teachers.\nRafi: Will you work regularly?\nSohan: Yes. I know that hard work is needed to reach a goal.\nRafi: What qualities should a good teacher have?\nSohan: A good teacher should be kind, honest, patient, and helpful.\nRafi: Do you want to teach poor children too?\nSohan: Yes. I want to help poor children with their studies.\nRafi: That's a very good aim.\nSohan: Thank you. What is your aim?\nRafi: I want to become a doctor and help sick people.\nSohan: I hope you will reach your aim.\nRafi: Thank you. I also hope you will become a good teacher.\nSohan: Thank you very much.`)">
