      <div class="topic-box-item" id="topic-item-205" onclick="handleTopicClick(this, 'Borrowing a Book Dialogue for HSC', `Rafi: Good morning, Shafiq. Where are you going in such a hurry?\nShafiq: Good morning, Rafi. I am going to the college library to borrow a book.\nRafi: What kind of book are you looking for?\nShafiq: I am looking for a book on English literature. I need it for my upcoming examination.\nRafi: Have you checked the catalogue of the library?\nShafiq: Yes, I have. I found a book that seems very useful for my preparation.\nRafi: Do you know the procedure for borrowing a book?\nShafiq: Yes. First, I have to show my library card to the librarian and give the necessary information.\nRafi: How many books can you borrow at a time?\nShafiq: I can borrow two books at a time according to the library rules.\nRafi: How long can you keep the book?\nShafiq: I can keep it for two weeks. I have to return it within the given time.\nRafi: What will happen if you return the book late?\nShafiq: I will have to pay a fine for each extra day.\nRafi: You should also take proper care of the book.\nShafiq: Of course. I will not fold the pages or write anything on them.\nRafi: That's good. Books are valuable sources of knowledge.\nShafiq: I agree. A good book can help us gain knowledge and develop our ideas.\nRafi: Shall I come with you to the library?\nShafiq: Certainly. You can also borrow a book that you need.\nRafi: Great! Let's go together.\nShafiq: Sure. Thank you.`)">
